name: Deploy Jekyll to Cloudflare Workers

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cloudflare-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Japanese font and Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          pip install pillow

      - name: Generate Tokushoho Image
        env:
          TOKUSHOHO_TEXT: ${{ secrets.TOKUSHOHO_TEXT }}
        run: |
          python3 scripts/generate_tokushoho_image.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll
        run: gem install jekyll -v "~> 4.4" --no-document

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: jekyll build --source ./ --destination ./_site

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
