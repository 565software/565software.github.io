<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>565software</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      color: #1a1a1a;
      background: #fff;
      line-height: 1.7;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .tagline {
      color: #555;
      margin-bottom: 2.5rem;
    }
    h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #2563eb;
    }
    .app-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .app-card h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .app-card p {
      color: #555;
      font-size: 0.95rem;
    }
    .app-links {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
      padding-top: 0.8rem;
      border-top: 1px solid #e5e7eb;
    }
    .app-links a {
      color: #2563eb;
      text-decoration: none;
      font-size: 0.9rem;
    }
    .app-links a:hover { text-decoration: underline; }
    footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e5e7eb;
      color: #888;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>565software</h1>
    <p class="tagline">Android アプリの開発・公開を行っています。</p>

    <h2>アプリ / Apps</h2>
    <div class="app-card">
      <h3>mvsync</h3>
      <p>動画を横に並べて比較するアプリ。</p>
      <p>A side-by-side video comparison app.</p>
      <ul class="app-links">
        <li><a href="mvsync/privacy-policy.html">プライバシーポリシー</a></li>
        <li><a href="mvsync/privacy-policy-en.html">Privacy Policy</a></li>
        <li><a href="mvsync/support.html">サポート / Support</a></li>
      </ul>
    </div>

    <footer>
      <p>&copy; 2026 565software</p>
    </footer>
  </div>
</body>
</html>
